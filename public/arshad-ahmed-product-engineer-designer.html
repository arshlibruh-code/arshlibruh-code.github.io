// ---------------------------------------------------------------- render

function duration(startYear, startMonth, endYear, endMonth) {
  const end = endYear ? new Date(endYear, endMonth - 1) : new Date();
  let years = end.getFullYear() - startYear;
  let months = end.getMonth() + 1 - startMonth;
  if (months < 0) { years--; months += 12; }
  const y = years > 0 ? years + ' yr' + (years > 1 ? 's' : '') : '';
  const m = months > 0 ? months + ' mo' + (months > 1 ? 's' : '') : '';
  return [y, m].filter(Boolean).join(' ');
}

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function render() {
  const key = (location.hash || '#main').slice(1);
  const lane = LANES[key] || LANES.main;

  document.title = 'Arshad Ahmed, ' + lane.title;
  document.getElementById('r-title').textContent = lane.title;
  document.getElementById('r-summary').textContent = lane.summary;

  document.getElementById('r-skills').innerHTML = lane.skills.map(
    r => '<div class="skills-row"><strong>' + r[0] + '</strong> &nbsp; ' + r[1] + '</div>'
  ).join('');

  document.getElementById('r-work').innerHTML = WORK.map(w => {
    const span = w.to ? duration(w.from[0], w.from[1], w.to[0], w.to[1]) : duration(w.from[0], w.from[1]);
    const range = MON[w.from[1] - 1] + ' ' + w.from[0] + ' – ' +
                  (w.to ? MON[w.to[1] - 1] + ' ' + w.to[0] : 'Present');
    const keys = w.bullets.only ? ['only'] : lane.bullets.filter(k => w.bullets[k]);
    return '<div class="entry"><div class="entry-header"><h3>' + w.role + '</h3>' +
      '<span class="meta">' + range + ' · ' + span + ' · ' + w.where + '</span></div><ul>' +
      keys.map(k => '<li>' + w.bullets[k] + '</li>').join('') + '</ul></div>';
  }).join('');

  document.getElementById('r-projects').innerHTML = lane.projects.map(k => {
    const p = PROJECTS[k];
    return '<div class="project"><h3>' + p.name + ': </h3><p>' + p.text + '</p></div>';
  }).join('');

  document.getElementById('r-edu').innerHTML =
    '<div class="entry"><div class="entry-header"><h3>MBA, Presidency University</h3>' +
    '<span class="meta">June 2018 – June 2020 · Bengaluru, India</span></div>' +

}

addEventListener('hashchange', render);
